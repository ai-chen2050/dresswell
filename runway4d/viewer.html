<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DressWell × Faltwerk · 4DGS WebGPU Viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #100e0c; color: #f3ece3; overflow: hidden;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  }
  body.is-embedded, body.is-embedded html { background: transparent !important; }
  #c { width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; background: transparent; }
  #c:active { cursor: grabbing; }
  #hud {
    position: fixed; left: 12px; right: 12px; bottom: 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    pointer-events: none; z-index: 10;
  }
  body.is-embedded #hud {
    opacity: 0; pointer-events: none; height: 1px; overflow: hidden;
  }
  .hud-pill {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(16, 14, 12, 0.72);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #f3ece3; font-size: 11.5px; font-weight: 600;
  }
  #play {
    pointer-events: auto;
    appearance: none; border: 1px solid rgba(46, 189, 133, 0.55);
    background: rgba(46, 189, 133, 0.2); color: #4ed4a2;
    border-radius: 999px; padding: 5px 12px; font-size: 11.5px; font-weight: 700;
    cursor: pointer; transition: background .15s ease, transform .15s ease;
  }
  #play:hover { background: rgba(46, 189, 133, 0.34); transform: translateY(-1px); }
  #bg-label { display: none; }
  #stats { color: #c7bdb1; font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  #xr-hint { color: #e8c78c; font-size: 12px; width: 100%; }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).get('embed') === '1') {
    document.documentElement.style.background = 'transparent';
    document.body.classList.add('is-embedded');
  }
</script>
<canvas id="c"></canvas>
<div id="hud">
  <button id="play" type="button" title="Play / Pause">▶ / ❚❚</button>
  <select id="scene" hidden></select>
  <label id="bg-label" class="hud-pill">Stage <input id="bg" type="color" value="#100e0c"></label>
  <label id="occ-box" hidden><input id="occ" type="checkbox" checked><span>Hands occlude</span></label>
  <label id="occ-debug-box" hidden><input id="occ-debug" type="checkbox"><span>Show occlusion</span></label>
  <label id="recolor-box" hidden><input id="recolor" type="checkbox"><span>Auto colour</span></label>
  <span id="recolor-info" hidden></span>
  <button id="xr-ar" type="button" hidden>MR</button>
  <span id="stats" class="hud-pill">loading WebGPU stream …</span>
  <div id="xr-hint" hidden></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
